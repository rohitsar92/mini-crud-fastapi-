name: Deploy Angular Frontend to InfinityFree

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Detect Angular output directory
        id: build
        shell: bash
        run: |
          echo "Searching for Angular index.html..."
          find dist -maxdepth 5 -name index.html -print

          INDEX_FILE=$(find dist -maxdepth 5 -name index.html \
            -not -path '*/server/*' \
            -not -path '*/media/*' \
            -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found inside dist/"
            exit 1
          fi

          BUILD_DIR=$(dirname "$INDEX_FILE")
          echo "dir=$BUILD_DIR/" >> "$GITHUB_OUTPUT"
          echo "Deploy directory: $BUILD_DIR/"

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ${{ steps.build.outputs.dir }}
          server-dir: /ronitechnologies.ct.ws/htdocs/
